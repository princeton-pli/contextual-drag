[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextual-drag"
version = "0.1.0"
description = "Packaging and CLI support for the Contextual Drag research workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Contextual Drag Authors" }
]
dependencies = [
  "datasets>=2",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2",
  "python-Levenshtein>=0.27",
  "scriptconfig>=0.8.2",
  "seaborn>=0.13",
  "sympy>=1.12",
  "tqdm>=4.66",
  "zss>=1.2.0",
]

[project.optional-dependencies]
inference = [
  "accelerate>=1.0",
  "transformers>=4.45",
  "vllm>=0.10",
]
eval = [
  "math-verify>=0.8.0",
]
dev = [
  "pytest>=8",
]

[project.scripts]
contextual-drag = "contextual_drag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contextual_drag = [
  "resources/inference/*.json",
  "resources/evaluation/crux/*.jsonl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
